#ddev-generated
services:
  orthanc:
    container_name: ddev-${DDEV_SITENAME}-orthanc
    hostname: ${DDEV_SITENAME}-orthanc
    image: orthancteam/orthanc:26.9.1
    restart: "no"
    ports:
      - "127.0.0.1:${ORTHANC_DICOM_PORT:-4242}:4242"
    expose:
      - "8042"
    environment:
      ORTHANC__NAME: ${ORTHANC__NAME:-${DDEV_SITENAME}}
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: "8042:8042"
      HTTPS_EXPOSE: "8043:8042"
    volumes:
      - ".:/mnt/ddev_config"
      - "./orthanc/config:/etc/orthanc:ro"
      - "./orthanc/scripts:/etc/share/orthanc/scripts:ro"
      - "orthanc-data:/var/lib/orthanc/db"
    healthcheck:
      test: ["CMD", "python3", "/mnt/ddev_config/orthanc/tools/orthanc.py", "ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  orthanc-data:
    name: "ddev-${DDEV_SITENAME}-orthanc-data"
